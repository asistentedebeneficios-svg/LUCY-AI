        function to12h(time24) {
          if (!time24) return '';
          const [h, m] = time24.split(':').map(Number);
          const period = h >= 12 ? 'PM' : 'AM';
          const h12 = h % 12 || 12;
          return `${h12}:${m.toString().padStart(2, '0')} ${period}`;

        function formatScheduledDate(dateStr) {
          if (!dateStr || dateStr === 'Inmediata' || dateStr === 'Pendiente') return dateStr;
          const date = new Date(dateStr);
          if (isNaN(date.getTime())) return dateStr; 
          return date.toLocaleDateString('en-US', {
            month: '2-digit', day: '2-digit', year: 'numeric',
            hour: 'numeric', minute: '2-digit', hour12: true
          });
        }

        function formatFirestoreDate(timestamp) {
          if (!timestamp) return 'Reciente';
          try {
            const options = {month: '2-digit', day: '2-digit', year: 'numeric'};
            return timestamp.toDate ? timestamp.toDate().toLocaleDateString('en-US', options) : new Date(timestamp.seconds * 1000).toLocaleDateString('en-US', options);

          if (!content || typeof content !== 'string') return null;
          const parts = content.split(/(\*\*.*?\*\*)/g);
          return (
            <span className="leading-relaxed tracking-normal font-sans text-sm">
              {parts.map((part, i) => {
                if (part.startsWith('**') && part.endsWith('**')) {
                  return <strong key={i} className="font-bold text-slate-900">{part.slice(2, -2)}</strong>;
                }
                return part.split('\n').map((line, j) => (
                  <React.Fragment key={`${i}-${j}`}>
                    {line}
                    {j < part.split('\n').length - 1 && <br />}
                  </React.Fragment>
                ));
              })}

        const getAgentStatus = (config) => {
          if (config.vacationMode) return { isAgentAvailable: false, message: "No disponible temporalmente" };
          const now = new Date();
          const dayName = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'][now.getDay()];
          const schedule = config.schedule?.[dayName];
          if (!schedule || !schedule.enabled) return { isAgentAvailable: false, message: "No disponible hoy" };
          const currentMinutes = now.getHours() * 60 + now.getMinutes();
          const [startH, startM] = schedule.start.split(':').map(Number);
          const [endH, endM] = schedule.end.split(':').map(Number);
          
          const startTotal = startH * 60 + startM;
          const endTotal = endH * 60 + endM;
          
          if (currentMinutes < startTotal) return { isAgentAvailable: false, message: `Disponible a las ${to12h(schedule.start)}` };
          if (currentMinutes >= endTotal) return { isAgentAvailable: false, message: "No disponible por hoy" };
          return { isAgentAvailable: true, message: "Agentes Disponibles" };

        async function fetchGeminiWithRetry(payload, retries = 5, delay = 1000) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`;
          for (let i = 0; i < retries; i++) {
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (response.ok) return await response.json();
            } catch (e) { if (i === retries - 1) throw e; }
            await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
          }
          throw new Error("Error de conexión");
        }

                  ${historyText}

                  HOY: ${todayDateStr}.
                  HORARIOS VÁLIDOS: ${scheduleStr}.

                  OBJETIVO: Obtener confirmación explícita de los datos antes de agendar.

                  TUS TAREAS:
                  1. Si el usuario acaba de dar su teléfono o fecha: Extrae los datos, valida horarios (si aplica) y marca 'action: update_info'. Tu respuesta DEBE pedir confirmación (Ej: "¿Confirma que su número es XXX?").
                  2. Si el usuario está CONFIRMANDO (Sí, correcto, ese es) los datos que tú le acabas de repetir: Marca 'action: confirm'.
                  3. Si el usuario corrige datos: Marca 'action: update_info' con los nuevos datos y pide confirmación de nuevo.
                  4. Si tiene dudas: Marca 'action: continue_chat'.

                  REGLAS:
                  - NUNCA marques 'confirm' si el usuario apenas está dando el dato. Debe haber un turno donde tú preguntas y él confirma.
                  - Si es 'ahora', solo necesitamos teléfono.
                  - Si es 'programada', necesitamos teléfono y fecha/hora.
                  - Usa formato 12h (AM/PM).

                  EXTRACCIÓN OBLIGATORIA DEL PERFIL COMPLETO (Busca en todo el historial):
                  - nombre
                  - edad
                  - estado
                  - salud
                  - fuma (Si/No)
                  - presupuesto
                  - resumen_ai (Breve resumen de 1 línea: Edad, Salud, Necesidad)

                  SALIDA JSON:
                  {
                    "action": "confirm" (usuario aceptó explícitamente/dio teléfono para 'ahora') | "update_info" (usuario dio/cambió datos) | "continue_chat" (duda/charla),
                    "data": {
                       "telefono": "...", 
                       "fecha_hora": "${isNow ? 'Inmediata' : 'YYYY-MM-DD HH:mm (AM/PM)'}" (Si es 'ahora', usa 'Inmediata'),
                       "horario_valido": boolean
                    },
                    "perfil": {
                       "nombre": "...",
                       "edad": "...",
                       "estado": "...",
                       "salud": "...",
                       "fuma": "...",
                       "presupuesto": "...",
                       "resumen_ai": "..."
                    },
                    "ai_reply": "Tu respuesta como Lucy."
                  }
                `;

                const res = await fetchGeminiWithRetry({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } });
                const analysis = JSON.parse(cleanJsonResponse(res.candidates?.[0]?.content?.parts?.[0]?.text || "{}"));
                
                if (analysis.action === 'confirm') {
                   const finalMessages = [...newMsgs, { role: 'assistant', content: analysis.ai_reply || "¡Perfecto! Su solicitud ha sido recibida. Un agente le contactará en breve." }];
                   
                   const finalLeadData = {
                     ...analysis.perfil, 
                     resumen_ai: analysis.perfil.resumen_ai || "Sin resumen", 
                     telefono: analysis.data.telefono || tempContactInfo?.telefono,
                     horario_preferido: analysis.data.fecha_hora || tempContactInfo?.horario_calculado || (contactType === 'ahora' ? 'Inmediata' : 'Pendiente'),
                     metodo_contacto: contactType,
                     status: 'active',
                     fullChat: finalMessages.map(m=>({role:m.role, content:String(m.content)})), 
                     createdAt: serverTimestamp()
                   };

                   await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leads'), finalLeadData);

                   setConversationFinished(true);
                   setMessages(finalMessages); 
                   setLoading(false);
                   return;
                }

                if (analysis.action === 'update_info') {
                   if (!analysis.data.horario_valido && contactType !== 'ahora') {
                      setMessages(prev => [...prev, { role: 'assistant', content: analysis.ai_reply }]);
                   } else {
                      const newTemp = { 
                         ...tempContactInfo, 
                         telefono: analysis.data.telefono || tempContactInfo?.telefono,
                         horario_calculado: analysis.data.fecha_hora || tempContactInfo?.horario_calculado
                      };
                      setTempContactInfo(newTemp);
                      setSchedulingStep('confirming_date'); 
                      setMessages(prev => [...prev, { role: 'assistant', content: analysis.ai_reply }]);
                   }
                   setLoading(false);
                   return;
                }

                setMessages(prev => [...prev, { role: 'assistant', content: analysis.ai_reply }]);
                setLoading(false);
                return;

              } catch (e) { console.error(e); setLoading(false); }
              return;
            }

            try {
              const passiveCheckPrompt = `Analiza: "${userMsg}". ¿Hay número de teléfono? JSON: {"has_phone": bool, "phone": "str"}`;
              const passiveRes = await fetchGeminiWithRetry({ contents: [{ parts: [{ text: passiveCheckPrompt }] }], generationConfig: { responseMimeType: "application/json" } });
              const passiveData = JSON.parse(cleanJsonResponse(passiveRes.candidates?.[0]?.content?.parts?.[0]?.text || "{}"));

              if (passiveData.has_phone) {
                 const fullHistory = newMsgs.map(m => `${m.role}: ${m.content}`).join(' | ');
                 
                 setTempContactInfo({ telefono: passiveData.phone });
                 setContactType('programada'); 
                 setSchedulingStep('confirming_date');
                 
                 setMessages(prev => [...prev, { role: 'assistant', content: `Gracias. Para confirmar, ¿su número es ${passiveData.phone}?` }]);
                 setLoading(false);
                 return;
              }

              const payload = { contents: [{ parts: [{ text: `${systemPromptWithSchedule}\n\nHistorial:\n${newMsgs.map(m=>`${m.role}: ${m.content}`).join('\n')}\nAsesor:` }] }] };
              const result = await fetchGeminiWithRetry(payload);
              const rawAiRes = result.candidates?.[0]?.content?.parts?.[0]?.text || "No pude procesar eso.";
              const aiRes = cleanAiMessage(rawAiRes);
              setMessages(prev => [...prev, { role: 'assistant', content: aiRes }]);
              setLoading(false);

              const checkPrompt = `Revisa historial. ¿El usuario dio estos 6 datos?: Nombre, Edad, Estado, Salud, Fumar, Presupuesto. JSON: {"calificado": true/false} Historial: ${newMsgs.map(m=>`${m.role}: ${m.content}`).join('\n')}`;
              const checkRes = await fetchGeminiWithRetry({ contents: [{ parts: [{ text: checkPrompt }] }], generationConfig: { responseMimeType: "application/json" } });
              const checkData = JSON.parse(cleanJsonResponse(checkRes.candidates?.[0]?.content?.parts?.[0]?.text || "{}"));
              
              if (checkData.calificado === true) setShowOptions(true);

            } catch (err) { 
                console.error(err); 
                setLoading(false); 
            } 
          };

          const handleContactChoice = (type) => {
            setContactType(type);
            setShowOptions(false);
            setSchedulingStep('asking_info');
            const contactMsg = type === 'ahora' 
              ? '¡Perfecto! Para conectar de inmediato, indíqueme su **número de teléfono**. Su privacidad es sagrada: no hacemos spam.'
              : `¡Excelente! Para que el agente le llame, indíqueme su **número de teléfono** y el **horario** preferido.\n\n(Disponibilidad de Agentes: ${scheduleStr})`;
            setMessages(prev => [...prev, { role: 'assistant', content: contactMsg }]);
          };

          return (
            <div className="max-w-[480px] mx-auto flex flex-col h-full bg-white rounded-[32px] shadow-2xl border border-gray-100 overflow-hidden relative font-sans">
              <div className="bg-white/90 backdrop-blur-xl p-5 border-b border-gray-100 flex items-center gap-4 z-10 sticky top-0">
                <div className="relative"><LucyAvatar className="w-12 h-12" /></div>
                <div>
                  <h2 className="font-bold text-[#1d1d1f] text-lg tracking-tight">Lucy</h2>
                  <div className="flex items-center gap-2">
                      <div className="flex items-center gap-1.5">
                        <span className={`w-2 h-2 rounded-full bg-green-500 animate-pulse`}></span>
                        <p className="text-xs text-[#86868b] font-medium">En Línea</p>
                      </div>
                      <span className="text-[#86868b] text-[10px]">•</span>
                      <p className="text-xs text-blue-600 font-medium">{activeUsers} personas consultando</p>
                  </div>
                </div>
              </div>
              <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-6 bg-white no-scrollbar">
                {messages.map((m, i) => (
                  <div key={i} ref={i === messages.length - 1 ? lastMessageRef : null} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300`}>
                     {m.role === 'assistant' && <LucyAvatar className="w-8 h-8 mr-2 mt-auto shrink-0" />}
                     <div className={`w-fit max-w-[75%] px-5 py-3 rounded-2xl text-[16px] leading-relaxed shadow-sm text-left ${m.role === 'user' ? 'bg-[#007AFF] text-white rounded-br-none' : 'bg-[#F2F2F7] text-[#1d1d1f] rounded-bl-none'}`}><RichText content={String(m.content || '')} /></div>
                  </div>
                ))}
                {loading && <div className="flex justify-start pl-10"><div className="bg-[#F2F2F7] px-4 py-3 rounded-2xl rounded-bl-none flex gap-1.5 items-center w-fit"><span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></span><span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></span><span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></span></div></div>}
                {showOptions && !conversationFinished && (
                  <div className="flex flex-col gap-2 pt-2 animate-in zoom-in px-8">
                    <button 
                      onClick={() => handleContactChoice('ahora')} 
                      disabled={!isAgentAvailable} 
                      className={`w-full font-medium py-3.5 rounded-xl transition-all text-sm shadow-sm flex items-center justify-center gap-2 active:scale-95 ${isAgentAvailable ? 'bg-[#007AFF] text-white hover:bg-[#0062cc]' : 'bg-gray-100 text-gray-400 cursor-not-allowed border border-gray-200'}`}
                    >
                      {isAgentAvailable ? <Zap size={16} fill="currentColor"/> : <Moon size={16}/>} {isAgentAvailable ? 'Hablar con un Agente Ahora' : 'Agentes no disponibles'}
                    </button>
                    <button onClick={() => handleContactChoice('programada')} className="w-full bg-[#F2F2F7] text-[#007AFF] font-medium py-3.5 rounded-xl hover:bg-[#E5E5EA] transition-all text-sm flex items-center justify-center gap-2 active:scale-95"><Calendar size={16}/> Programar Llamada</button>
                    {!isAgentAvailable && <p className="text-[10px] text-center text-slate-400 mt-1">Nuestros agentes no están disponibles en este momento. Puede programar una llamada.</p>}
                  </div>
                )}
                {conversationFinished && <div className="flex justify-center pt-4 pb-8 animate-in fade-in"><span className="text-xs font-medium text-[#86868b] bg-[#F2F2F7] px-3 py-1 rounded-full">Sesión Finalizada</span></div>}
              </div>
              <form onSubmit={handleSend} className={`p-4 bg-white/90 backdrop-blur-xl border-t border-gray-100 flex gap-3 ${conversationFinished ? 'opacity-50 pointer-events-none' : ''}`}>
                <input ref={inputRef} value={input} onChange={(e)=>setInput(e.target.value)} disabled={loading || conversationFinished} placeholder="Escribe un mensaje..." className="flex-1 bg-[#F2F2F7] border-0 rounded-full px-5 py-3 text-[16px] focus:ring-2 focus:ring-[#007AFF]/20 text-[#1d1d1f] placeholder:text-[#86868b] outline-none transition-all" />
                <button type="submit" disabled={loading || conversationFinished || !input.trim()} className="bg-[#007AFF] text-white p-3 rounded-full hover:bg-[#0062cc] transition-all active:scale-90 disabled:opacity-50 disabled:scale-100 flex items-center justify-center"><Send size={18} fill="currentColor" /></button>
              </form>
            </div>
          );
        }

        // INICIAR LA APLICACIÓN
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
