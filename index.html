        function cleanAiMessage(text) {
            if (!text) return '';
            let cleaned = text;
            cleaned = cleaned.replace(/^(assistant|model|lucy):\s*/i, '');
            cleaned = cleaned.replace(/```json[\s\S]*?```/g, '');
            cleaned = cleaned.replace(/\[MODE:[A-Z_]+\]/g, '');
            cleaned = cleaned.replace(/\[BUTTONS:[\s\S]*?\]+/g, '');
            cleaned = cleaned.replace(/[\]]+\s*$/, '');
            return cleaned.trim();
        }

        function formatScheduledDate(d) {
            if (!d || d.length < 10) return d;
            const date = new Date(d);
            return isNaN(date) ? d : date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function formatFirestoreDate(ts) {
            if (!ts) return 'Reciente';
            if (OFFLINE_MODE && typeof ts === 'string') return new Date(ts).toLocaleDateString('en-US');
            try {
                return ts.toDate ? ts.toDate().toLocaleDateString('en-US') : new Date(ts.seconds * 1000).toLocaleDateString('en-US');
            } catch (e) { return 'Fecha inválida'; }
        }

        const RichText = ({ content }) => {
            if (!content || typeof content !== 'string') return null;
            return <span className="text-sm leading-relaxed">{content.split(/(\*\*.*?\*\*)/g).map((part, i) => part.startsWith('**') ? <strong key={i} className="text-slate-900 font-bold">{part.slice(2, -2)}</strong> : part)}</span>;
        };

        const rateLimit = { lastCall: 0, check: function() { const now = Date.now(); if (now - this.lastCall < 1000) return false; this.lastCall = now; return true; } };        
        
        const DEFAULT_SYSTEM_PROMPT = `Eres Lucy, una asistente virtual.`;

        const DEFAULT_SCHEDULE = { 
            lunes: { enabled: true, slots: [{start: '09:00', end: '18:00'}] },
            martes: { enabled: true, slots: [{start: '09:00', end: '18:00'}] },
            miercoles: { enabled: true, slots: [{start: '09:00', end: '18:00'}] },
            jueves: { enabled: true, slots: [{start: '09:00', end: '18:00'}] },
            viernes: { enabled: true, slots: [{start: '09:00', end: '18:00'}] },
            sabado: { enabled: false, slots: [{start: '10:00', end: '14:00'}] },
            domingo: { enabled: false, slots: [{start: '10:00', end: '14:00'}] }
        };

        const getAgentStatus = (config) => {
            try {
                if (!config) return { isAgentAvailable: true, message: "Disponible" };
                const now = new Date();
                
                if (config.vacationMode && config.vacationStart && config.vacationEnd) {
                    const vStart = new Date(config.vacationStart + 'T00:00:00');
                    const vEnd = new Date(config.vacationEnd + 'T23:59:59');
                    if (now >= vStart && now <= vEnd) {
                        const resumeDate = new Date(vEnd);
                        resumeDate.setDate(resumeDate.getDate() + 1);
                        return { isAgentAvailable: false, isVacation: true, resumeDate };
                    }
                }
                
                const days = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
                const dayName = days[now.getDay()];
                const dayConfig = config.schedule?.[dayName];
                
                if (!dayConfig || !dayConfig.enabled) return { isAgentAvailable: false, message: "Cerrado hoy" };

                let slots = dayConfig.slots || [];
                if (slots.length === 0 && dayConfig.start && dayConfig.end) {
                    slots = [{ start: dayConfig.start, end: dayConfig.end }];
                }
                if (slots.length === 0) return { isAgentAvailable: false, message: "Sin turnos" };

                const currentMins = now.getHours() * 60 + now.getMinutes();
                const isOpenNow = slots.some(slot => {
                    if (!slot.start || !slot.end) return false;
                    const [sH, sM] = slot.start.split(':').map(Number);
                    const [eH, eM] = slot.end.split(':').map(Number);
                    if (isNaN(sH) || isNaN(eH)) return false;
                    const startMins = sH * 60 + (sM || 0);
                    const endMins = eH * 60 + (eM || 0);
                    return currentMins >= startMins && currentMins < endMins;
                });

                return isOpenNow ? { isAgentAvailable: true, message: "Agentes Disponibles" } : { isAgentAvailable: false, message: "Cerrado ahora" };
            } catch (error) {
                return { isAgentAvailable: true, message: "Disponible" }; 
            }
        };

        // Función auxiliar para convertir hora militar a AM/PM
const to12h = (time24) => {
    if (!time24) return '';
    const [h, m] = time24.split(':');
    const hour = parseInt(h, 10);
    const suffix = hour >= 12 ? 'PM' : 'AM';
    const hour12 = hour % 12 || 12;
    return `${hour12}:${m} ${suffix}`;
};

const getScheduleText = (schedule) => {
    if (!schedule) return "No especificado";
    const days = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
    return days.map(d => {
        const c = schedule[d];
        if (!c?.enabled) return `- ${d.charAt(0).toUpperCase() + d.slice(1)}: Cerrado`;
        const slots = c.slots || (c.start ? [{start: c.start, end: c.end}] : []);
        if (slots.length === 0) return `- ${d.charAt(0).toUpperCase() + d.slice(1)}: Sin horario`;
        
        // AQUI ESTA LA MAGIA: Convertimos a 12h antes de enviar el texto
        const times = slots.map(s => `${to12h(s.start)} a ${to12h(s.end)}`).join(' y de ');
        
        return `- ${d.charAt(0).toUpperCase() + d.slice(1)}: ${times}`;
    }).join('\n');
};

        async function fetchGeminiWithRetry(payload) {
            if (!rateLimit.check()) throw new Error("Espera unos segundos.");
            
            if (OFFLINE_MODE) { 
                await new Promise(r => setTimeout(r, 1000)); 
                return { candidates: [{ content: { parts: [{ text: "Modo offline simulado." }] } }] }; 
            }

            // CORRECCIÓN: Lista de modelos ampliada para evitar el error 404
            // Intentará el más nuevo, si falla, baja al siguiente hasta encontrar uno que tu llave acepte.
            const models = [
                'gemini-1.5-flash-latest',  // Nombre explícito de la última versión
                'gemini-1.5-flash-001',     // Nombre técnico específico
                'gemini-1.5-flash',         // Alias estándar
                'gemini-pro'                // Versión 1.0 (La vieja confiable, casi nunca falla)
            ];

            let lastError = null;

            // Configuración de seguridad para evitar bloqueos falsos
            const securePayload = {
                ...payload,
                safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_ONLY_HIGH" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_ONLY_HIGH" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_ONLY_HIGH" }
                ]
            };

            for (const model of models) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`;
                try {
                    const res = await fetch(url, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(securePayload) 
                    });
                    
                    if (res.ok) {
                        return await res.json();
                    }
                    
                    // Solo guardamos el error en consola para depuración, pero continuamos al siguiente modelo
                    const errText = await res.text();
                    console.warn(`Modelo ${model} falló (${res.status}):`, errText);
                    lastError = `Error ${res.status}`;
                } catch (e) { 
                    lastError = e.message; 
                }
            }
            
            // Si llegamos aquí, fallaron los 4 modelos.
            throw new Error(`Error de conexión AI: No se pudo contactar a ningún modelo.`);
        }

        // 6. COMPONENTES VISUALES
        const LucyAvatar = ({ className = "w-10 h-10" }) => (<img src="https://imnufit.com/wp-content/uploads/2026/01/IMG_0014.jpeg" alt="Lucy" className={`${className} rounded-full object-cover shadow-sm border border-slate-100 bg-slate-200`} onError={(e) => { e.target.onerror = null; e.target.src = "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400"; }} />);

        const BrainAvatar = ({ className = "w-10 h-10" }) => (<div className={`${className} rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-sm`}><Sparkles size={20} strokeWidth={2} /></div>);

        // --- REPORTES DASHBOARD ---
        const ReportsDashboard = ({ leads, agents }) => {
            const [filterAgent, setFilterAgent] = useState('all');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            const filteredLeads = useMemo(() => {
                return (leads || []).filter(l => {

                    let matchesDate = true;
                    if (startDate && endDate) {

                        const end = new Date(endDate); end.setHours(23,59,59,999);
                        matchesDate = d >= start && d <= end;
                    }
                    return matchesAgent && matchesDate;
                });
            }, [leads, filterAgent, startDate, endDate]);

            const assignedLeads = filteredLeads.filter(l => l.assignedAgentId).length;
            const closedSales = filteredLeads.filter(l => l.status === 'sold').length;
            const conversionRate = assignedLeads > 0 ? ((closedSales / assignedLeads) * 100).toFixed(1) : 0;
            const activeLeads = filteredLeads.filter(l => !l.assignedAgentId && l.status !== 'archived').length;

            const agentPerformance = useMemo(() => {

                    const mySales = myLeads.filter(l => l.status === 'sold').length;
                    const myConversion = myLeads.length > 0 ? ((mySales / myLeads.length) * 100).toFixed(0) : 0;
                    return { ...agent, assigned: myLeads.length, closed: mySales, conversion: myConversion };

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100"><div className="flex justify-between items-start mb-2"><div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><UserCheck size={18}/></div></div><p className="text-2xl font-bold text-gray-900">{assignedLeads}</p><p className="text-[10px] uppercase font-bold text-gray-400 tracking-wide">Leads Asignados</p></div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100"><div className="flex justify-between items-start mb-2"><div className="p-2 bg-green-50 text-green-600 rounded-lg"><DollarSign size={18}/></div></div><p className="text-2xl font-bold text-gray-900">{closedSales}</p><p className="text-[10px] uppercase font-bold text-gray-400 tracking-wide">Ventas Cerradas</p></div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100"><div className="flex justify-between items-start mb-2"><div className="p-2 bg-purple-50 text-purple-600 rounded-lg"><TrendingUp size={18}/></div></div><p className="text-2xl font-bold text-gray-900">{conversionRate}%</p><p className="text-[10px] uppercase font-bold text-gray-400 tracking-wide">Tasa Cierre</p></div>

        // 7. MODALES
        const LeadDetailModal = ({ lead, agents, onClose, onAssignClick, onUpdateStatus, isArchive }) => {

                        const d = l.assignedAt?.toDate ? l.assignedAt.toDate() : new Date(l.assignedAt?.seconds * 1000);
                        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    });
                } else if (dateFilter === 'lastMonth') {
                    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    const endLastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                    agentLeads = agentLeads.filter(l => {
                        const d = l.assignedAt?.toDate ? l.assignedAt.toDate() : new Date(l.assignedAt?.seconds * 1000);

                    });

                    const end = new Date(customEnd);

                    agentLeads = agentLeads.filter(l => {
                        const d = l.assignedAt?.toDate ? l.assignedAt.toDate() : new Date(l.assignedAt?.seconds * 1000);

        // --- CLIENT CHAT (DEFINIDO ANTES DE APP) ---
        function ClientChat({ aiConfig, onSaveLead, onOpenLogin }) {
            const [activeUsers, setActiveUsers] = useState(Math.floor(Math.random() * (28 - 18 + 1)) + 18);
            const [msgs, setMsgs] = useState([
                { role: 'assistant', content: 'Hola, soy Lucy, su asistente personal experta en **Gastos Finales**. Mi misión es brindarle la información que necesita para su tranquilidad y la de su familia.\n\nTenga la plena seguridad de que **todo lo que hablemos es confidencial**; nada será divulgado sin su expresa autorización. Mi único objetivo es ayudarle.\n\nPara poder servirle mejor, ¿Con quién tengo el gusto de hablar hoy?' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [showShareModal, setShowShareModal] = useState(false);
            const [urlCopied, setUrlCopied] = useState(false);
            const [uiState, setUiState] = useState(null);
            const [isSessionClosed, setIsSessionClosed] = useState(false); // <--- NUEVO INTERRUPTOR 

            const scrollRef = useRef(null);
            const agentStatus = useMemo(() => getAgentStatus(aiConfig), [aiConfig]);
            const { isAgentAvailable } = agentStatus;

            useEffect(() => {
                const i = setInterval(() => setActiveUsers(p => p + (Math.random() > 0.5 ? 1 : -1)), 5000);
                return () => clearInterval(i);
            }, []);

            useEffect(() => { 
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; 
            }, [msgs, loading, uiState]);

            const handleCopyLink = () => {
                const url = window.location.href;
                navigator.clipboard.writeText(url).then(() => {
                    setUrlCopied(true);
                    setTimeout(() => setUrlCopied(false), 2500);
                });
            };

             // FUNCIÓN CENTRAL: ENVIAR MENSAJE A LUCY
            const send = async (textOverride = null) => {
                const textToSend = textOverride || input;
                if (!textToSend.trim() || loading) return;

                setUiState(null);
                setInput('');
                setLoading(true);

                const newM = [...msgs, { role: 'user', content: textToSend }];
                setMsgs(newM);

                try {
                    // 1. OBTENER FECHA Y HORA ACTUAL (Formato AM/PM)
                const now = new Date();
                const fechaHoy = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const horaActual = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

                // --- LÓGICA DE DISPONIBILIDAD ---
                const { isAgentAvailable, isVacation, resumeDate } = agentStatus;
                let statusInstruction = "";
                
                if (isVacation && resumeDate) {
                    statusInstruction = `ESTADO ACTUAL: VACACIONES (Estamos cerrados hasta el ${resumeDate.toLocaleDateString()}). PROHIBIDO ofrecer "Hablar con agente ahora".`;
                } else if (isAgentAvailable) {
                    statusInstruction = "ESTADO ACTUAL: ABIERTO. Puedes ofrecer botones para conectar con un agente ahora si el usuario está listo.";
                } else {
                    statusInstruction = "ESTADO ACTUAL: CERRADO. PROHIBIDO ofrecer botones de llamada inmediata. Solo ofrece agendar para después.";
                }

                const scheduleText = getScheduleText(aiConfig?.schedule);
                const systemBase = aiConfig?.systemPrompt || DEFAULT_SYSTEM_PROMPT;

                // 2. INYECTAR CONTEXTO (CEREBRO CALENDARIO + CONFIRMACIÓN)
                const prompt = `
                  ${systemBase}

                  [DATOS INTERNOS]
                  - HOY ES: ${fechaHoy}
                  - HORA ACTUAL: ${horaActual}
                  - ${statusInstruction}

                  [OBJETIVO]
                  Tu meta es obtener: Nombre, Motivo, Salud, PRESUPUESTO y definir una CITA o contacto inmediato.

                  [FORMATO DE GUARDADO OBLIGATORIO]
                  Cuando tengas los datos, genera UNICAMENTE este bloque JSON:
                  \`\`\`json
                  {
                    "action": "data_ready",
                    "nombre": "Nombre del cliente",
                    "telefono": "Teléfono",
                    "email": "Email o null",
                    "resumen_ai": "Resumen breve",
                    "edad": "Edad",
                    "estado": "Estado (ej: FL)",
                    "salud": "Condición de salud",
                    "fuma": "Si/No",
                    "presupuesto": "Monto o rango (Ej: $50-$70/mes)",
                    "horario_preferido": "FECHA DE CITA o 'Inmediata'"
                  }
                  \`\`\`

                  [REGLAS DE GUARDADO]:
                  1. PRESUPUESTO: Si no es exacto, pon el rango del plan que le interesó.
                  2. HORARIO (CITA):
                     - Si es YA: Escribe "Inmediata".
                     - Si es CITA: Escribe la FECHA COMPLETA (Ej: "Lunes 14 de Agosto a las 4:00 PM").
                     - Calcula la fecha exacta basada en "HOY ES". No uses "mañana".

                  HORARIOS VÁLIDOS:
                  ${scheduleText}

                  HISTORIAL:
                  ${newM.map(m => `${m.role}: ${m.content}`).join('\n')}
                `;
                    
                    // DEBUG
                    console.log("--- ENVÍO A GEMINI ---");

                    const res = await fetchGeminiWithRetry({ contents: [{ parts: [{ text: prompt }] }] });
                    const rawText = res.candidates[0].content.parts[0].text;
                    
                    // DETECTAR BOTONES
                    let nextButtons = null;
                    const buttonMatch = rawText.match(/\[BUTTONS:(\[\s*\{[\s\S]*?\}\s*\])\]/);
                    if (buttonMatch && buttonMatch[1]) {
                        try { nextButtons = JSON.parse(buttonMatch[1]); } catch (e) { console.error("Error botones:", e); }
                    }

                    // PROCESAR JSON DATA_READY
                    const jsonMatch = rawText.match(/```json([\s\S]*?)```/);
                    if (jsonMatch) {
                        try {
                            const jsonStr = jsonMatch[1];
                            const data = JSON.parse(jsonStr);
                            if (data.action === 'data_ready') {
                        onSaveLead({ ...data, fullChat: newM });
                        setIsSessionClosed(true); // <--- BLOQUEAMOS LA SESIÓN AQUÍ
                    }
                        } catch (jsonErr) { console.error("Error JSON:", jsonErr); }
                    }

                    // LIMPIAR RESPUESTA
                    let finalReply = cleanAiMessage(rawText);
                    finalReply = finalReply.replace(/\[BUTTONS:[\s\S]*?\]/g, '').trim();

                    setMsgs([...newM, { role: 'assistant', content: finalReply }]);
                    setUiState(nextButtons); 

                } catch (e) {
                    console.error(e);
                    setMsgs([...newM, { role: 'assistant', content: "Lo siento, tuve un pequeño error de conexión. ¿Podría repetirme eso?" }]);
                }
                setLoading(false);
            };
            
            return (
                <div className="max-w-[480px] mx-auto flex flex-col h-full bg-white rounded-[32px] shadow-2xl border border-gray-100 overflow-hidden relative font-sans">
                    <div className="bg-white/90 backdrop-blur-xl p-5 border-b border-gray-100 flex items-center justify-between z-10 sticky top-0">
                        <div className="flex items-center gap-4">
                            <div className="relative"><LucyAvatar className="w-12 h-12" /></div>
                            <div>
                                <h2 className="font-bold text-[#1d1d1f] text-lg tracking-tight">Lucy</h2>
                                <div className="flex items-center gap-2">
                                    <div className="flex items-center gap-1.5"><span className={`w-2 h-2 rounded-full bg-green-500 animate-pulse`}></span><p className="text-xs text-[#86868b] font-medium">En Línea</p></div>
                                    <span className="text-[#86868b] text-[10px]">•</span>
                                    <p className="text-xs text-blue-600 font-medium">{activeUsers} personas</p>
                                </div>
                            </div>
                        </div>
                        <button onClick={() => setShowShareModal(true)} className="p-2 bg-slate-50 text-slate-400 rounded-full hover:bg-slate-100 hover:text-blue-600 transition-colors" title="Guardar enlace"><Share2 size={20} /></button>
                    </div>

                    <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-6 bg-white no-scrollbar">
                        {msgs.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300`}>
                                {m.role === 'assistant' && <LucyAvatar className="w-8 h-8 mr-2 mt-auto shrink-0" />}
                                <div className={`w-fit max-w-[85%] px-5 py-3 rounded-2xl text-[15px] leading-relaxed shadow-sm text-left ${m.role === 'user' ? 'bg-[#007AFF] text-white rounded-br-none' : 'bg-[#F2F2F7] text-[#1d1d1f] rounded-bl-none'}`}>
                                    <RichText content={m.content} />
                                </div>
                            </div>
                        ))}
                        
                        {loading && (
                            <div className="flex justify-start pl-10">
                                <div className="bg-[#F2F2F7] px-4 py-3 rounded-2xl rounded-bl-none flex gap-1.5 items-center w-fit">
                                    <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></span>
                                    <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></span>
                                    <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></span>
                                </div>
                            </div>
                        )}

                        {!loading && uiState && Array.isArray(uiState) && (
                            <div className="flex flex-wrap gap-2 pl-10 animate-in fade-in slide-in-from-bottom-4 pr-4">
                                {uiState.map((btn, idx) => (
                                    <button 
                                        key={idx}
                                        onClick={() => send(btn.value)} 
                                        disabled={loading}
                                        className={`flex items-center gap-2 px-5 py-3 border rounded-2xl shadow-sm transition-all text-sm font-medium active:scale-95 ${
                                            btn.style === 'primary' 
                                            ? 'bg-[#007AFF] text-white border-transparent hover:bg-[#0062cc]' 
                                            : 'bg-white border-gray-200 text-gray-700 hover:bg-blue-50 hover:border-blue-200 hover:text-blue-600'
                                        }`}
                                    >
                                        {btn.label}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {isSessionClosed ? (
                    <div className="p-6 bg-white/90 backdrop-blur-xl border-t border-gray-100 text-center animate-in fade-in slide-in-from-bottom-4">
                        <div className="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm border border-green-200">
                            <CheckCircle size={28} strokeWidth={2.5} />
                        </div>
                        <h3 className="font-bold text-gray-900 text-lg">¡Solicitud Completada!</h3>
                        <p className="text-sm text-gray-500 mt-1 max-w-xs mx-auto">Sus datos han sido enviados correctamente al agente asignado. Ya puede cerrar esta ventana.</p>
                    </div>
                ) : (
                    <form onSubmit={(e) => { e.preventDefault(); send(); }} className="p-4 bg-white/90 backdrop-blur-xl border-t border-gray-100 flex gap-3 items-center">
                        <input 
                            value={input} 
                            onChange={e => setInput(e.target.value)} 
                            placeholder={uiState ? "O elige una opción..." : "Escribe un mensaje..."}
                            className="flex-1 bg-[#F2F2F7] border-0 rounded-full px-5 py-3 text-[16px] focus:ring-2 focus:ring-[#007AFF]/20 text-[#1d1d1f] placeholder:text-[#86868b] outline-none transition-all" 
                        />
                        <button 
                            disabled={loading || !input.trim()} 
                            className="w-12 h-12 bg-[#007AFF] text-white rounded-full hover:bg-[#0062cc] transition-all active:scale-90 disabled:opacity-50 disabled:scale-100 flex items-center justify-center shrink-0 shadow-md"
                        >
                            <Send size={20} fill="currentColor" className="ml-0.5" />
                        </button>
                    </form>
                )}
 
                    <div className="text-center py-2 bg-white border-t border-gray-50">{onOpenLogin && <button onClick={onOpenLogin} className="text-[9px] text-slate-300 hover:text-slate-400 transition-colors">Acceso Corporativo</button>}</div>
                    
                    {showShareModal && (
                        <div className="absolute inset-0 z-50 bg-black/30 backdrop-blur-sm flex items-center justify-center p-6 animate-in fade-in">
                            <div className="bg-white rounded-[24px] shadow-2xl p-6 w-full max-w-sm animate-in zoom-in-95">
                                <div className="flex justify-between items-start mb-4"><div><h3 className="text-lg font-bold text-slate-800">Guardar conversación</h3><p className="text-xs text-slate-500 mt-1">Copie este enlace para volver a hablar con Lucy más tarde sin perder el contacto.</p></div><button onClick={() => setShowShareModal(false)} className="p-1 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full"><X size={16} /></button></div>
                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center gap-2 mb-4"><input type="text" readOnly value={window.location.href} className="bg-transparent border-0 text-xs text-slate-600 w-full outline-none font-mono truncate" /></div>
                                <button onClick={handleCopyLink} className={`w-full py-3 rounded-xl font-medium text-sm transition-all flex items-center justify-center gap-2 shadow-lg ${urlCopied ? 'bg-green-500 text-white' : 'bg-black text-white hover:bg-slate-800'}`}>{urlCopied ? <CheckCircle size={16} /> : <Copy size={16} />}{urlCopied ? '¡Enlace Copiado!' : 'Copiar Enlace'}</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // -----------------------------------------------------------------------------
        // 8. APP PRINCIPAL
        // -----------------------------------------------------------------------------
        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('landing');
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState(null);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [adminTab, setAdminTab] = useState('active');
            const [leads, setLeads] = useState([]);
            const [agents, setAgents] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [permissionError, setPermissionError] = useState(false);

            // Estados Globales
            const [selectedLead, setSelectedLead] = useState(null);
            const [assignModalData, setAssignModalData] = useState({ isOpen: false, targetIds: [] });

            const [aiConfig, setAiConfig] = useState({
                systemPrompt: DEFAULT_SYSTEM_PROMPT, 
                webhookUrl: "", 
                assignmentWebhookUrl: "", 
                schedule: DEFAULT_SCHEDULE,
                vacationMode: false, 
                vacationStart: "", 
                vacationEnd: "", 
                personality: "Empático"
            });

            // Utils
            const generateId = () => Math.random().toString(36).substr(2, 9);

            useEffect(() => { const handlePopState = (event) => { if (event.state && event.state.view) setView(event.state.view); else setView('landing'); }; window.addEventListener('popstate', handlePopState); return () => window.removeEventListener('popstate', handlePopState); }, []);
            const navigateTo = (newView) => { setView(newView); window.history.pushState({ view: newView }, '', `#${newView}`); };
            
            // Inactivity Handler
            const savedLogout = useRef(() => { if(isAdmin) { if (!OFFLINE_MODE && auth) signOut(auth); setIsAdmin(false); navigateTo('landing'); } else { navigateTo('landing'); } });
            useEffect(() => {
                let t; const reset = () => { clearTimeout(t); t = setTimeout(() => savedLogout.current(), 600000); };
                window.addEventListener('mousemove', reset); window.addEventListener('click', reset);
                reset();
                return () => { clearTimeout(t); window.removeEventListener('mousemove', reset); window.removeEventListener('click', reset); };
            }, [isAdmin]);

            useEffect(() => {
                if (OFFLINE_MODE) { setUser({ uid: 'offline', isAnonymous: true }); return; }
                if (!auth) return;
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (u) { setUser(u); if (!u.isAnonymous) { setIsAdmin(true); navigateTo('admin'); } else { setIsAdmin(false); } }
                    else { signInAnonymously(auth).catch(e => console.error(e)); }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (OFFLINE_MODE) { 
                    // DATOS DE PRUEBA SIMULADOS
                    setLeads([
                        { id: '1', nombre: 'Juan Pérez', telefono: '+13055550101', edad: '65', estado: 'FL', salud: 'Buena', fuma: 'No', resumen_ai: 'Interesado en cobertura básica.', createdAt: { seconds: Date.now()/1000 }, status: 'active' },
                        { id: '2', nombre: 'Maria Rodriguez', telefono: '+14075550102', edad: '72', estado: 'TX', salud: 'Diabetes', fuma: 'No', resumen_ai: 'Busca seguro para gastos finales urgente.', createdAt: { seconds: Date.now()/1000 - 86400 }, status: 'active' }
                    ]); 
                    setAgents([
                        { id: 'a1', nombre: 'Agente Demo', email: 'demo@ejemplo.com', telefono: '555-0199', estados: 'FL, TX', foto: '' }
                    ]);
                    return; 
                }
                if (!user || !db) return;
                const leadsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'leads');
                const unsub = onSnapshot(leadsRef, (snapshot) => {
                    setPermissionError(false);
                    const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLeads(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                }, (error) => { if (error.code === 'permission-denied' && isAdmin) setPermissionError(true); });
                
                getDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config')).then(s => {
                    if (s.exists()) {
                        // Merge con default para asegurar que no falten campos
                        setAiConfig(prev => ({ ...prev, ...s.data() }));
                    }
                }).catch(e => console.log("Usando Config Default"));
                
                return () => unsub();
            }, [user, isAdmin]);

            useEffect(() => {
                if (OFFLINE_MODE || !user || !isAdmin || !db) return;
                const agentsDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'agents_list');
                const unsub = onSnapshot(agentsDocRef, (docSnap) => { if (docSnap.exists()) { setAgents(docSnap.data().list || []); } else { setAgents([]); } });
                return () => unsub();
            }, [user, isAdmin]);

            const handleLogin = async (e) => { e.preventDefault(); setIsLoggingIn(true); setLoginError(null); if (OFFLINE_MODE) { setTimeout(() => { setIsAdmin(true); navigateTo('admin'); setShowLogin(false); setIsLoggingIn(false); }, 1000); return; } try { await signInWithEmailAndPassword(auth, email, password); setShowLogin(false); setEmail(''); setPassword(''); } catch (error) { setLoginError("Credenciales no válidas."); } setIsLoggingIn(false); };
            const handleLogout = async () => { if (!OFFLINE_MODE && auth) await signOut(auth); setIsAdmin(false); navigateTo('landing'); };
            
            // GUARDAR LEAD Y DISPARAR WEBHOOK (CORREGIDO)
            const saveLeadToDb = async (leadData) => { 
                if (OFFLINE_MODE) { alert("Modo Offline: Lead guardado localmente (Simulado)"); return; } 
                if (!db) return;
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'leads'), { ...leadData, createdAt: serverTimestamp(), status: 'active' }); 
                
                // Disparar Webhook Inmediatamente
                if (aiConfig.webhookUrl) {
                    fetch(aiConfig.webhookUrl, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(leadData) 
                    }).catch(e => console.error("Error Webhook:", e));
                }
            };
            
            const saveAiConfig = async (newConfig) => { if (OFFLINE_MODE) { setAiConfig(newConfig); return; } if (!user || !isAdmin) return; await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config'), newConfig); setAiConfig(newConfig); };

            const deleteLead = async (ids) => { const idArray = Array.isArray(ids) ? ids : [ids]; if (!isAdmin) return; const batch = writeBatch(db); idArray.forEach(id => { const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'leads', id); batch.delete(ref); }); await batch.commit(); }
            const updateLeadStatus = async (ids, status) => { const idArray = Array.isArray(ids) ? ids : [ids]; if (!isAdmin) return; const batch = writeBatch(db); idArray.forEach(id => { const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'leads', id); batch.update(ref, { status: status }); }); await batch.commit(); }

            const handleAssignAgent = async (agentId) => {
                if (!isAdmin) return;
                const targetIds = assignModalData.targetIds;
                if (targetIds.length === 0) return;

                const assignedAgent = agentId !== 'unassign' ? agents.find(a => a.id === agentId) : null;
                const batch = writeBatch(db);
                targetIds.forEach(id => {
                    const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'leads', id);
                    batch.update(ref, {
                        assignedAgentId: agentId === 'unassign' ? null : agentId,
                        assignedAt: agentId === 'unassign' ? null : serverTimestamp()
                    });
                });
                await batch.commit();

                if (assignedAgent && aiConfig.assignmentWebhookUrl) {
                    const targetLeads = leads.filter(l => targetIds.includes(l.id));
                    targetLeads.forEach(lead => {
                        if (lead.email) {
                            const payload = { leadName: lead.nombre, leadEmail: lead.email, leadPhone: lead.telefono, agentName: assignedAgent.nombre, agentEmail: assignedAgent.email, agentPhone: assignedAgent.telefono, agentPhoto: assignedAgent.foto, assignedAt: new Date().toISOString() };
                            fetch(aiConfig.assignmentWebhookUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(err => console.error("Error webhook asignación:", err));
                        }
                    });
                }
                setAssignModalData({ isOpen: false, targetIds: [] });
            };

            const openAssignModal = (ids, actionType) => { 
                if (actionType === 'unassign') {
                    if (confirm("¿Desvincular agente de este lead?")) {
                        const batch = writeBatch(db);
                        ids.forEach(id => { const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'leads', id); batch.update(ref, { assignedAgentId: null, assignedAt: null }); });
                        batch.commit();
                    }
                } else {
                    setAssignModalData({ isOpen: true, targetIds: ids }); 
                }
            };

            const saveAgent = async (agentData) => {
                if (!isAdmin) return; const agentsRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'agents_list'); const docSnap = await getDoc(agentsRef); let currentList = docSnap.exists() ? (docSnap.data().list || []) : [];
                if (agentData.id) { currentList = currentList.map(a => a.id === agentData.id ? { ...agentData, updatedAt: Date.now() } : a); }
                else { const newAgent = { ...agentData, id: generateId(), createdAt: Date.now() }; currentList.push(newAgent); }
                await setDoc(agentsRef, { list: currentList });
            };
            const deleteAgent = async (ids) => {
                const idArray = Array.isArray(ids) ? ids : [ids]; if (!isAdmin) return; const agentsRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'agents_list'); const docSnap = await getDoc(agentsRef); if (!docSnap.exists()) return;
                let currentList = docSnap.data().list || []; currentList = currentList.filter(a => !idArray.includes(a.id)); await setDoc(agentsRef, { list: currentList });
            };

            if (!user) return <div className="h-screen flex items-center justify-center bg-[#F5F5F7] text-slate-400">Cargando...</div>;

            return (
                <div className="h-[100dvh] bg-[#F5F5F7] text-[#1d1d1f] font-sans antialiased flex flex-col overflow-hidden">
                    {OFFLINE_MODE && <div className="absolute top-0 w-full z-[100] bg-yellow-500 text-white p-1 text-center text-[10px] font-bold flex justify-center items-center gap-2"><WifiOff size={12} /> MODO DISEÑO (OFFLINE)</div>}
                    {permissionError && <div className="absolute top-0 w-full z-[100] bg-red-600 text-white p-2 text-center text-xs font-bold">Error de Permisos</div>}
                    <nav className="bg-white/80 backdrop-blur-xl border-b border-white/20 shrink-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-rose-500 text-white p-1.5 rounded-lg shadow-sm"><ProtectionLogo size={20} /></div>
                                <span className="font-semibold text-base sm:text-lg tracking-tight text-black">Asistente de Beneficios</span>
                            </div>
                            <div className="flex items-center gap-3">
                                {isAdmin ? (
                                    <div className="flex bg-[#E8E8ED]/50 p-1 rounded-full animate-in fade-in">
                                        <button onClick={() => navigateTo('chat')} className={`px-4 py-1.5 rounded-full text-xs font-medium transition-all ${view === 'chat' ? 'bg-white text-black shadow-sm' : 'text-slate-500'}`}>Asistente</button>
                                        <button onClick={() => navigateTo('admin')} className={`px-4 py-1.5 rounded-full text-xs font-medium transition-all ${view === 'admin' ? 'bg-white text-black shadow-sm' : 'text-slate-500'}`}>Admin</button>
                                        <button onClick={handleLogout} className="ml-2 px-2 text-xs text-red-400 hover:text-red-600 font-medium">Salir</button>
                                    </div>
                                ) : null}
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 relative overflow-hidden flex flex-col w-full max-w-7xl mx-auto">
                        {!isAdmin ? (
                            view === 'landing' ? <LandingView onStartChat={() => navigateTo('chat')} onOpenLogin={() => setShowLogin(true)} /> :
                                <div className="flex-1 flex flex-col p-4 md:p-6 overflow-hidden"><ClientChat aiConfig={aiConfig} onSaveLead={saveLeadToDb} onOpenLogin={() => setShowLogin(true)} /></div>
                        ) : (
                            view === 'chat' ? <div className="flex-1 flex flex-col p-4 md:p-6 overflow-hidden"><ClientChat aiConfig={aiConfig} onSaveLead={saveLeadToDb} /></div> :
                                <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                        <div className="flex gap-1 bg-[#E8E8ED]/50 p-1 rounded-xl w-fit self-start">
                                            <button onClick={() => setAdminTab('active')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${adminTab === 'active' ? 'bg-white text-black shadow-sm' : 'text-[#86868b] hover:text-black'}`}><Inbox size={14} /> Activos</button>
                                            <button onClick={() => setAdminTab('assigned')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${adminTab === 'assigned' ? 'bg-white text-black shadow-sm' : 'text-[#86868b] hover:text-black'}`}><UserCheck size={14} /> Asignados</button>
                                            <button onClick={() => setAdminTab('reports')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${adminTab === 'reports' ? 'bg-white text-black shadow-sm' : 'text-[#86868b] hover:text-black'}`}><BarChart3 size={14} /> Reportes</button>
                                            <button onClick={() => setAdminTab('archived')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${adminTab === 'archived' ? 'bg-white text-black shadow-sm' : 'text-[#86868b] hover:text-black'}`}><Archive size={14} /> Archivo</button>
                                            <button onClick={() => setAdminTab('agents')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${adminTab === 'agents' ? 'bg-white text-black shadow-sm' : 'text-[#86868b] hover:text-black'}`}><Briefcase size={14} /> Agentes</button>
                                            <button onClick={() => setAdminTab('brain')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${adminTab === 'brain' ? 'bg-white text-black shadow-sm' : 'text-[#86868b] hover:text-black'}`}><Sparkles size={14} /> Inteligencia</button>
                                        </div>
                                        {adminTab !== 'brain' && adminTab !== 'reports' && <div className="relative group w-full md:w-auto"><Search className="absolute left-3 top-2.5 text-gray-400" size={14} /><input type="text" placeholder="Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="pl-9 pr-8 py-2 bg-white border-0 rounded-xl text-sm w-full md:w-64 outline-none shadow-sm" />{searchTerm && (<button onClick={() => setSearchTerm('')} className="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600"><X size={14} /></button>)}</div>}
                                    </div>

                                    {adminTab === 'active' ? <LeadsList leads={leads.filter(l => (!l.status || l.status === 'active') && !l.assignedAgentId)} agents={agents} onOpenLead={(l) => setSelectedLead(l)} onOpenAssign={openAssignModal} onDeleteLead={deleteLead} onUpdateStatus={updateLeadStatus} isArchive={false} searchTerm={searchTerm} /> :
                                        adminTab === 'assigned' ? <LeadsList leads={leads.filter(l => (!l.status || l.status === 'active' || l.status === 'sold') && l.assignedAgentId)} agents={agents} onOpenLead={(l) => setSelectedLead(l)} onOpenAssign={openAssignModal} onDeleteLead={deleteLead} onUpdateStatus={updateLeadStatus} isArchive={false} searchTerm={searchTerm} /> :
                                            adminTab === 'archived' ? <LeadsList leads={leads.filter(l => l.status === 'archived')} agents={agents} onOpenLead={(l) => setSelectedLead(l)} onOpenAssign={openAssignModal} onDeleteLead={deleteLead} onUpdateStatus={updateLeadStatus} isArchive={true} searchTerm={searchTerm} /> :
                                                adminTab === 'reports' ? <ReportsDashboard leads={leads} agents={agents} /> :
                                                    adminTab === 'agents' ? <AgentsManager agents={agents} leads={leads} onOpenLead={(l) => setSelectedLead(l)} onSaveAgent={saveAgent} onDeleteAgent={deleteAgent} searchTerm={searchTerm} /> :
                                                        <AdminBrain aiConfig={aiConfig} onSaveConfig={saveAiConfig} />}
                                </div>
                        )}
                    </main>

                    <LeadDetailModal lead={selectedLead} agents={agents} onClose={() => setSelectedLead(null)} onAssignClick={handleAssignAgent} onUpdateStatus={updateLeadStatus} isArchive={adminTab === 'archived'} />
                    <AgentAssignmentModal isOpen={assignModalData.isOpen} agents={agents} onClose={() => setAssignModalData({ ...assignModalData, isOpen: false })} onAssign={handleAssignAgent} />

                    {showLogin && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm border border-gray-100">
                                <div className="flex justify-between items-center mb-6"><div className="flex items-center gap-2 text-red-600"><ShieldAlert size={20} /><h3 className="font-bold text-lg text-slate-800">Acceso Restringido</h3></div><button onClick={() => setShowLogin(false)} className="text-slate-400 hover:text-slate-600"><X size={20} /></button></div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Correo Corporativo</label><input type="email" autoFocus value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black/10 outline-none text-sm" placeholder="usuario@empresa.com" /></div>
                                    <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Credencial</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black/10 outline-none text-sm" placeholder="••••••••" /></div>
                                    {loginError && <div className="p-3 bg-red-50 text-red-600 text-xs rounded-lg font-medium">{loginError}</div>}
                                    <button type="submit" disabled={isLoggingIn} className="w-full bg-black text-white font-medium py-3 rounded-xl hover:bg-gray-800 transition-all text-sm shadow-lg disabled:opacity-50">{isLoggingIn ? 'Verificando...' : 'Iniciar Sesión'}</button>
                                </form>
                                <p className="mt-4 text-center text-[10px] text-slate-400">Este sistema monitorea todos los accesos.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
