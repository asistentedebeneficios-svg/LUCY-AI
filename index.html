<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente de Beneficios | Lucy</title>
    <link rel="icon" type="image/jpeg" href="https://imnufit.com/wp-content/uploads/2026/01/IMG_0014.jpeg">
    
    <!-- Hoja de Estilos Personalizada -->
    <link rel="stylesheet" href="styles.css">

    <!-- Tailwind CSS (Framework de diseño) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] } } }
        }
    </script>
    
    <!-- Compilador Babel (Para que funcione React en el navegador sin build) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <!-- Contenedor Principal de la App -->
    <div id="root"></div>

    <!-- Carga del Código Lógico (JavaScript/React) -->
    <!-- Nota: data-type="module" es importante para los imports -->
    <script type="text/babel" data-type="module" src="app.js"></script>
</body>
</html>
